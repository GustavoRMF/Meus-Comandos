<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Comandos</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-base: #0f1115; --bg-panel: #161920; --bg-card: #20242d;
            --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981; --danger: #ef4444;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #334155; --code-bg: #0b0f19;
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex; height: 100vh; font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base); color: var(--text-main); overflow: hidden;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* 1. Sidebar (Categorias) */
        .sidebar {
            width: 240px; background-color: var(--bg-panel); border-right: 1px solid var(--border);
            padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
        }
        .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 16px; padding-left: 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .category-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 12px; text-align: left; cursor: pointer; border-radius: 8px; font-size: 14px; font-weight: 500; transition: var(--transition); display: flex; align-items: center; gap: 12px; }
        .category-btn i { font-size: 20px; width: 24px; text-align: center; }
        .category-btn:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .category-btn.active { background-color: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* 2. Coluna da Lista */
        .list-column {
            width: 320px; background-color: var(--bg-base); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .list-header { padding: 20px; border-bottom: 1px solid var(--border); background-color: var(--bg-panel); }
        
        .btn-new {
            width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center;
            align-items: center; gap: 8px; margin-bottom: 16px; transition: var(--transition);
        }
        .btn-new:hover { background-color: var(--primary-hover); }

        .search-bar { display: flex; align-items: center; background-color: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; transition: var(--transition); }
        .search-bar:focus-within { border-color: var(--primary); }
        .search-bar i { color: var(--text-muted); font-size: 16px; }
        .search-bar input { border: none; background: transparent; padding: 10px; color: white; width: 100%; outline: none; font-size: 13px; }

        .list-items { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .cmd-item { padding: 14px; background-color: var(--bg-panel); border-radius: 8px; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; }
        .cmd-item:hover { border-color: #475569; }
        .cmd-item.active { background-color: rgba(99, 102, 241, 0.1); border-color: var(--primary); }
        .cmd-item h4 { font-size: 14px; margin-bottom: 6px; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .cmd-item p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 3. Área Principal (Detalhes e Formulário) */
        .detail-column { flex: 1; background-color: var(--bg-base); padding: 40px; display: flex; flex-direction: column; overflow-y: auto; }
        
        .view-section { display: none; }
        .view-section.show { display: block; }
        
        .empty-state { text-align: center; color: var(--text-muted); margin-top: 100px; display: none; }
        .empty-state.show { display: block; }
        .empty-state i { font-size: 48px; opacity: 0.5; margin-bottom: 16px; }

        .detail-header { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
        .detail-title-area h1 { font-size: 26px; margin: 12px 0; }
        .detail-desc { color: var(--text-muted); font-size: 15px; line-height: 1.6; }
        
        .card-actions { display: flex; gap: 8px; }
        .btn-icon { background-color: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
        .btn-icon:hover { background-color: rgba(255,255,255,0.1); }
        
        .code-box { background-color: var(--code-bg); padding: 20px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; overflow-x: auto; color: #10b981; border: 1px solid rgba(255,255,255,0.05); position: relative; margin-bottom: 24px; line-height: 1.5; white-space: pre-wrap; }
        .btn-copy { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
        .btn-copy:hover { background: rgba(255,255,255,0.2); }
        .btn-copy.copied { background: var(--success); }

        /* Estilos do Formulário */
        .form-section { display: none; background-color: var(--bg-panel); border: 1px solid var(--border); padding: 30px; border-radius: 12px; max-width: 800px; }
        .form-section.show { display: block; }
        .form-section h2 { margin-bottom: 24px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        input, select, textarea { width: 100%; background-color: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; transition: var(--transition); font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 100px; font-family: 'Courier New', monospace; }
        
        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); }

        /* Tags dinâmicas */
        .tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 700; text-transform: uppercase; display: inline-block; }
        .tag-python { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .tag-javascript { background-color: rgba(250, 204, 21, 0.15); color: #facc15; }
        .tag-git { background-color: rgba(249, 115, 22, 0.15); color: #f97316; }
        .tag-linux { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
        .tag-docker { background-color: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .tag-default { background-color: rgba(255,255,255,0.1); color: var(--text-muted); }

        #toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background-color: var(--success); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; transition: var(--transition); opacity: 0; z-index: 1000; display: flex; align-items: center; gap: 8px; }
        #toast.show { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>

    <!-- 1. Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 2. Coluna da Lista -->
    <section class="list-column">
        <div class="list-header">
            <button class="btn-new" onclick="mostrarFormulario()">
                <i class="ph-bold ph-plus"></i> Novo Comando
            </button>
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar em..." onkeyup="renderizarLista()">
            </div>
        </div>
        <div class="list-items" id="commands-list"></div>
    </section>

    <!-- 3. Área Principal -->
    <main class="detail-column">
        
        <!-- Estado Vazio -->
        <div class="empty-state show" id="emptyState">
            <i class="ph ph-hand-pointing"></i>
            <h2>Selecione um comando</h2>
            <p>Escolha um item na lista ao lado ou crie um novo comando.</p>
        </div>

        <!-- Área de Visualização do Comando -->
        <div class="view-section" id="viewArea">
            <div class="detail-header">
                <div class="detail-title-area">
                    <span class="tag" id="det-tag">Categoria</span>
                    <h1 id="det-titulo">Título</h1>
                    <p class="detail-desc" id="det-desc">Descrição</p>
                </div>
                <div class="card-actions">
                    <button class="btn-icon" onclick="editarComandoSelecionado()"><i class="ph ph-pencil-simple"></i> Editar</button>
                    <button class="btn-icon" style="color: var(--danger); border-color: rgba(239,68,68,0.3);" onclick="deletarComandoSelecionado()"><i class="ph ph-trash"></i></button>
                </div>
            </div>
            
            <div class="code-box">
                <button class="btn-copy" id="btnCopy" onclick="copiarCodigo()"><i class="ph ph-copy"></i> Copiar</button>
                <div id="det-codigo"></div>
            </div>
        </div>

        <!-- Formulário (Adicionar / Editar) -->
        <div class="form-section" id="formArea">
            <h2 id="form-titulo"><i class="ph ph-plus-circle"></i> Adicionar Comando</h2>
            
            <div class="input-group">
                <label>Título</label>
                <input type="text" id="cmdTitle" placeholder="Ex: Forçar push no Git">
            </div>
            
            <div class="input-group">
                <label>Categoria</label>
                <select id="cmdCategory">
                    <option value="Git">Git</option>
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Linux">Linux</option>
                    <option value="Docker">Docker</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Descrição (Opcional)</label>
                <input type="text" id="cmdDesc" placeholder="Para que serve este código?">
            </div>
            
            <div class="input-group">
                <label>Código do Comando</label>
                <textarea id="cmdCode" placeholder="Cole o seu código aqui..."></textarea>
            </div>
            
            <div class="form-actions">
                <button class="btn btn-primary" onclick="salvarComando()"><i class="ph ph-floppy-disk"></i> Salvar Comando</button>
                <button class="btn btn-danger" onclick="cancelarFormulario()">Cancelar</button>
            </div>
        </div>

    </main>

    <div id="toast"><i class="ph-fill ph-check-circle"></i> Notificação</div>

    <script>
        let comandosSalvos = [];
        let categoriaAtual = 'Todas';
        let comandoSelecionadoId = null;
        let modoEdicao = false; // Indica se o form é para criar ou editar

        const categorias = [
            { nome: 'Todas', icone: 'ph-squares-four' },
            { nome: 'Git', icone: 'ph-git-branch' },
            { nome: 'Python', icone: 'ph-file-code' },
            { nome: 'JavaScript', icone: 'ph-file-js' },
            { nome: 'Linux', icone: 'ph-terminal' },
            { nome: 'Docker', icone: 'ph-cube' }
        ];

        // 1. CARREGAR DADOS DO BACKEND (NEON)
        async function carregarComandos() {
            try {
                const response = await fetch('/comandos');
                comandosSalvos = await response.json();
                renderizarSidebar();
                renderizarLista();
            } catch (error) {
                console.error(error);
                mostrarToast("Erro ao conectar ao banco de dados.", true);
            }
        }

        // 2. RENDERIZAR SIDEBAR
        function renderizarSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '<h2><i class="ph ph-books"></i> Categorias</h2>'; 
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat.nome === categoriaAtual ? 'active' : ''}`;
                btn.innerHTML = `<i class="ph ${cat.icone}"></i> ${cat.nome}`;
                btn.onclick = () => mudarCategoria(cat.nome);
                sidebar.appendChild(btn);
            });
        }

        function mudarCategoria(catNome) {
            categoriaAtual = catNome;
            document.getElementById('searchInput').placeholder = `Buscar em ${catNome}...`;
            document.getElementById('searchInput').value = '';
            renderizarSidebar();
            renderizarLista();
        }

        // 3. RENDERIZAR LISTA DO MEIO
        function renderizarLista() {
            const container = document.getElementById('commands-list');
            const termoBusca = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            let comandosFiltrados = categoriaAtual === 'Todas' ? comandosSalvos : comandosSalvos.filter(c => c.categoria === categoriaAtual);
            
            if (termoBusca) {
                comandosFiltrados = comandosFiltrados.filter(c => 
                    c.titulo.toLowerCase().includes(termoBusca) || 
                    c.codigo.toLowerCase().includes(termoBusca)
                );
            }

            if (comandosFiltrados.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:13px;">Nenhum comando encontrado.</div>`;
                return;
            }

            comandosFiltrados.forEach((cmd) => {
                const item = document.createElement('div');
                item.className = `cmd-item ${comandoSelecionadoId === cmd.id ? 'active' : ''}`;
                item.onclick = () => mostrarDetalhes(cmd.id);
                
                // Mapeia icone de acordo com a categoria do item
                const catInfo = categorias.find(c => c.nome === cmd.categoria) || categorias[0];

                item.innerHTML = `
                    <h4><i class="ph ${catInfo.icone}" style="color:var(--primary);"></i> ${cmd.titulo}</h4>
                    <p>${cmd.descricao || cmd.codigo}</p>
                `;
                container.appendChild(item);
            });
        }

        // 4. CONTROLE DAS TELAS DA COLUNA PRINCIPAL
        function esconderTelasPrincipais() {
            document.getElementById('emptyState').classList.remove('show');
            document.getElementById('viewArea').classList.remove('show');
            document.getElementById('formArea').classList.remove('show');
        }

        function mostrarDetalhes(id) {
            comandoSelecionadoId = id;
            renderizarLista(); // Para atualizar o item ativo na lista
            esconderTelasPrincipais();
            document.getElementById('viewArea').classList.add('show');

            const cmd = comandosSalvos.find(c => c.id === id);
            
            // Tag styling
            const tagEl = document.getElementById('det-tag');
            tagEl.innerText = cmd.categoria;
            tagEl.className = `tag tag-${(cmd.categoria || '').toLowerCase()}`;

            document.getElementById('det-titulo').innerText = cmd.titulo;
            document.getElementById('det-desc').innerText = cmd.descricao || 'Sem descrição detalhada.';
            document.getElementById('det-codigo').innerText = cmd.codigo;
        }

        function mostrarFormulario(editar = false) {
            esconderTelasPrincipais();
            document.getElementById('formArea').classList.add('show');
            modoEdicao = editar;

            if (editar && comandoSelecionadoId) {
                const cmd = comandosSalvos.find(c => c.id === comandoSelecionadoId);
                document.getElementById('form-titulo').innerHTML = `<i class="ph ph-pencil-simple"></i> Editar Comando`;
                document.getElementById('cmdTitle').value = cmd.titulo;
                document.getElementById('cmdCategory').value = cmd.categoria;
                document.getElementById('cmdDesc').value = cmd.descricao || '';
                document.getElementById('cmdCode').value = cmd.codigo;
            } else {
                document.getElementById('form-titulo').innerHTML = `<i class="ph ph-plus-circle"></i> Adicionar Comando`;
                document.getElementById('cmdTitle').value = '';
                document.getElementById('cmdCategory').value = categoriaAtual !== 'Todas' ? categoriaAtual : 'Git';
                document.getElementById('cmdDesc').value = '';
                document.getElementById('cmdCode').value = '';
            }
        }

        function cancelarFormulario() {
            if (comandoSelecionadoId) {
                mostrarDetalhes(comandoSelecionadoId); // Volta pra visualização
            } else {
                esconderTelasPrincipais();
                document.getElementById('emptyState').classList.add('show');
            }
        }

        // 5. OPERAÇÕES DE BANCO (CRUD)
        async function salvarComando() {
            const titulo = document.getElementById('cmdTitle').value;
            const categoria = document.getElementById('cmdCategory').value;
            const descricao = document.getElementById('cmdDesc').value;
            const codigo = document.getElementById('cmdCode').value;

            if (!titulo || !codigo) { mostrarToast("Preencha título e comando!", true); return; }

            const payload = { titulo, categoria, descricao, codigo };

            try {
                let savedId = comandoSelecionadoId;
                if (modoEdicao) {
                    await fetch(`/comandos/${comandoSelecionadoId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    mostrarToast("Comando atualizado!");
                } else {
                    const res = await fetch('/comandos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const novoCmd = await res.json();
                    savedId = novoCmd.id; // Pega o ID gerado pelo banco para abrir automaticamente
                    mostrarToast("Comando salvo!");
                }
                
                await carregarComandos(); // Recarrega a lista do banco
                mostrarDetalhes(savedId); // Abre o comando que acabou de salvar
            } catch (error) {
                mostrarToast("Erro ao salvar.", true);
            }
        }

        function editarComandoSelecionado() {
            mostrarFormulario(true);
        }

        async function deletarComandoSelecionado() {
            if(confirm("Tem certeza que deseja excluir este comando definitivamente?")) {
                try {
                    await fetch(`/comandos/${comandoSelecionadoId}`, { method: 'DELETE' });
                    mostrarToast("Excluído com sucesso.");
                    comandoSelecionadoId = null;
                    await carregarComandos();
                    
                    esconderTelasPrincipais();
                    document.getElementById('emptyState').classList.add('show');
                } catch (error) {
                    mostrarToast("Erro ao excluir.", true);
                }
            }
        }

        // 6. UTILIDADES
        function copiarCodigo() {
            const texto = document.getElementById('det-codigo').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.getElementById('btnCopy');
                const htmlOriginal = `<i class="ph ph-copy"></i> Copiar`;
                btn.innerHTML = `<i class="ph-fill ph-check-circle"></i> Copiado`;
                btn.classList.add('copied');
                mostrarToast("Código copiado!");
                
                setTimeout(() => { 
                    btn.innerHTML = htmlOriginal; 
                    btn.classList.remove('copied'); 
                }, 2000);
            });
        }

        let toastTimeout;
        function mostrarToast(mensagem, isError = false) {
            const toast = document.getElementById('toast');
            toast.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
            toast.innerHTML = isError ? `<i class="ph-fill ph-warning-circle"></i> ${mensagem}` : `<i class="ph-fill ph-check-circle"></i> ${mensagem}`;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // Inicializa a aplicação buscando do Node.js/Neon
        carregarComandos();
    </script>
</body>
</html>
